name: Web

# FORK: this fork is web-only. Upstream's Android, Play and release workflows are removed here; when an upstream
# merge brings one back (modify/delete conflict), resolve it with `git rm` (see CLAUDE.md).
#
# Every PR and every push: npm run check, build and test. Pushes to main also deploy web/ to this fork's GitHub
# Pages. One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run check
      - name: Build
        working-directory: web
        run: npm run build
      - name: Test
        working-directory: web
        run: npm test

      - name: Assemble site (version.json names this commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p site/build
          cp web/index.html web/privacy.html web/styles.css web/manifest.webmanifest web/sw.js web/audio-worklet.js web/mic-worklet.js web/icon.svg web/icon-maskable.svg site/
          cp web/build/app.js web/build/dsp-worker.js site/build/
          if [ -d web/assets ]; then mkdir -p site/assets && cp -r web/assets/. site/assets/; fi
          # The version tracks upstream's versionName (app/build.gradle.kts) with a -fork suffix.
          V=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          cat > site/version.json <<JSON
          {
            "version": "${V:-0}-fork",
            "commit": "${GITHUB_SHA::7}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "play": "https://play.google.com/store/apps/details?id=com.rocketgod.mayhem",
            "release": "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          }
          JSON
          cat site/version.json
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy → GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
